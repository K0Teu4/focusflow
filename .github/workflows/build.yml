# .github/workflows/build.yml

# CI-сборка APK на ubuntu: без локального CMake-бага Windows.
# Триггеры: push в main + ручной запуск (кнопка Run workflow).
# Артефакт (APK) скачивается со страницы Actions -> последний прогон -> Artifacts.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # ручной запуск из вкладки Actions

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # первый прогон без кэшей дольше; запас на установку SDK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # JDK 17 для Gradle/Android (flet подхватит JAVA_HOME сам)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Базовый Android SDK + нужные пакеты; недостающее flet доустановит сам
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      # Тот же Flutter, что локально (3.41.7) — чтобы не словить расхождение версий
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.85.3

      # Нативный звук на Android (Kotlin MediaPlayer через Flet-extension).
      # Ставится ДО flet build, чтобы Dart/Kotlin-части скомпилировались в APK.
      - name: Install Flet Sound Extension
        run: pip install ./flet-sound

      - name: Build APK (arm64-v8a)
        run: flet build apk --arch arm64-v8a

      # Артефакт: два паттерна покрывают оба возможных расположения APK
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-apk
          path: |
            build/apk/**/*.apk
            build/flutter/build/**/app*.apk
          if-no-files-found: warn

# NOTE: жёлтый warning "Node.js 20 is deprecated" безвреден — сборка зелёная,
# actions просто принудительно идут на Node 24. Версии actions не трогаем,
# чтобы не плодить правки ради косметики.

# NOTE: кэши ~/.gradle и ~/.pub-cache добавим отдельным коммитом после первого
# зелёного прогона со звуком — чтобы не словить «устаревший кэш сломал сборку».