[project]
name = "flet-sound"
version = "0.1.0"
description = "Flet extension for native Android sound playback"
requires-python = ">=3.10"
dependencies = ["flet>=0.85.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flet_sound" = ["**/*"]