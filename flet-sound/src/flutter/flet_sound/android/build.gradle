group 'com.k0teu4.flet_sound'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.22' // Современная стабильная версия Kotlin
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0' // Совместимая версия Android Gradle Plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Namespace обязателен для современных версий AGP
    namespace 'com.k0teu4.flet_sound'
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21 // Стандартный минимум для Flutter
    }
}

dependencies {
    // Здесь НЕ должно быть слова 'module'. Зависимости добавляются только при необходимости.
}