[project]
name = "focusflow"
version = "1.0.0"
description = "Pomodoro timer with tasks and Premium subscription"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.85.3",
    "sqlalchemy",
]

[tool.flet]
org = "com.k0teu4"
product = "FocusFlow"
version = "1.0.0"
build = 1

[tool.flet.app]
exclude = [
    ".git",
    ".venv",
    ".github",
    "__pycache__",
    "db/focusflow.db",
    "test_full_app.py",
    "test_csv_export.py",
    "test_sounds.py",
    "test_app.py",
    "README.md",
]

# Первый кадр от ОС при тапе по иконке — тёмный бренд вместо дефолтного белого.
[tool.flet.splash]
color = "#141A2E"
dark_color = "#141A2E"

[tool.flet.android]
permissions = [
    "android.permission.INTERNET",
    "android.permission.VIBRATE",
]
min_sdk = 24
target_sdk = 34