[project]
name = "focusflow"
version = "0.1.0"
description = "FocusFlow Pomodoro app"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.85.3",
    "flet-audio",
    "sqlalchemy",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.flet.app]
exclude = [
    ".git",
    ".venv",
    ".github",
    "__pycache__",
    "db/focusflow.db",
    "test_full_app.py",
    "test_csv_export.py",
    "test_sounds.py",
    "test_app.py",
    "README.md",
]